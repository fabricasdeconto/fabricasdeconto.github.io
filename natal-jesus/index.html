<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#7E1F1F">
<link rel="icon" href="../marca/logo-compacto.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">

<!-- Meta Pixel: Fábrica de Contos - Site (3650201718481567).
     Funil de Natal: PageView + ViewContent (abriu), Lead (viu o resumo do pedido com o nome), Contact (foi para o WhatsApp). -->
<script>
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');

<noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=3650201718481567&ev=PageView&noscript=1"></noscript>

<style>
/* Duas telas: (1) antes/depois + nome e menino/menina, (2) resumo do pedido com a capa de exemplo + dedicatória opcional + WhatsApp.
   A história é sempre a criança e Jesus (sem personagens extras). */
:root{
  --tinta:#1E4A37; --tinta-2:#4F6D60; --papel:#FBF6EE; --folha:#FFFFFF; --linha:#EADFD0;
  --natal:#B3262A; --natal-escuro:#7E1F1F; --ouro:#F2B83B; --zap:#25B05A; --zap-escuro:#1B8B46;
  --fonte-titulo:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --fonte-texto:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:only light;
}
*{box-sizing:border-box}
html{background:var(--papel)}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--fonte-texto);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:480px;margin:0 auto;padding-block:12px 48px}
h1,h2{font-family:var(--fonte-titulo);line-height:1.12;text-wrap:balance;margin:0}
h1{font-size:clamp(27px,7.2vw,36px);font-weight:700}
h2{font-size:clamp(22px,5.8vw,27px);font-weight:600}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ouro);outline-offset:2px;border-radius:12px}
.marca{display:flex;justify-content:center;padding-bottom:4px}
.marca img{height:104px;width:auto;display:block;filter:drop-shadow(0 6px 10px rgba(126,31,31,.18))}
.tela{display:grid;gap:15px;text-align:center;animation:entra .3s ease both}
@keyframes entra{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
.selo{justify-self:center;display:inline-flex;gap:6px;align-items:center;background:var(--natal);color:#fff;font-weight:800;font-size:13px;letter-spacing:.4px;text-transform:uppercase;padding:7px 14px;border-radius:999px}
h1 em,h2 em{font-style:normal;color:var(--natal)}
.h1-arte img{display:block;width:100%;max-width:560px;height:auto;margin:0 auto;-webkit-mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent);mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
h1 .jesus{display:block;margin-top:4px;font-family:"Baloo 2",var(--fonte-titulo);font-weight:800;font-size:clamp(46px,13vw,62px);line-height:1;color:var(--natal);
  -webkit-text-stroke:0;text-shadow:0 3px 0 #fff,0 0 22px rgba(242,184,59,.75),0 6px 18px rgba(126,31,31,.25)}
h1 .jesus::before,h1 .jesus::after{content:"✨";font-size:.5em;vertical-align:middle;margin:0 6px}
.sub{color:var(--tinta-2);font-size:16.5px}
/* antes e depois: foto real -> desenho, e ao lado o celular passando os desenhos com Jesus */
.hero-jesus{width:100%;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1fr);gap:10px;align-items:center}
.ad-col{display:grid;gap:4px;justify-items:center;background:#fff;border-radius:20px;padding:8px;box-shadow:0 10px 26px rgba(126,31,31,.13)}
.ad-col img{display:block;width:100%;height:auto;border-radius:12px;object-fit:cover}
.ad-col .foto{aspect-ratio:1/1;border:2px solid var(--linha)}
.ad-col .desenho{aspect-ratio:1/1;border:3px solid var(--ouro)}
.ad-col small{font-weight:800;font-size:12px;color:var(--tinta-2);text-transform:uppercase;letter-spacing:.4px}
.seta{font-size:22px;color:var(--natal);font-weight:800;line-height:1}
.celular{position:relative;background:#111;border-radius:30px;padding:8px;box-shadow:0 14px 30px rgba(0,0,0,.28)}
.celular::before{content:"";position:absolute;top:13px;left:50%;transform:translateX(-50%);width:34%;height:9px;border-radius:9px;background:#111;z-index:2}
.celular video{display:block;width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:23px;background:#0b1f3a}
.capa-cel{width:min(250px,68%);justify-self:center}
.titulo-cel{position:absolute;left:8px;right:8px;top:8px;padding:30px 8px 34px;border-radius:23px 23px 0 0;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,0));display:grid;gap:2px;pointer-events:none}
.titulo-cel[hidden]{display:none}
.titulo-cel b{font-family:"Baloo 2",var(--fonte-titulo);font-weight:800;font-size:clamp(28px,9vw,38px);line-height:1;color:#D7393B;-webkit-text-stroke:5px #fff;paint-order:stroke fill}
.titulo-cel span{font-family:var(--fonte-titulo);font-weight:700;font-size:15px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.hero-jesus .celular{margin-bottom:42px}
.celular .tag.som{top:auto;right:auto;bottom:-40px;left:50%;transform:translateX(-50%);background:var(--natal);color:#fff;font-size:11.5px!important;padding:5px 9px!important;z-index:3;border:0;cursor:pointer;font:inherit;font-weight:800;font-size:13px;padding:7px 12px;box-shadow:0 3px 10px rgba(0,0,0,.25);animation:chama 1.8s ease-in-out infinite}
.celular .som[aria-pressed="true"]{animation:none}
@keyframes chama{50%{transform:translateX(-50%) scale(1.08)}}
.celular .tag{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);white-space:nowrap;background:rgba(255,255,255,.94);color:var(--natal);font-weight:800;font-size:12px;padding:5px 10px;border-radius:999px}
/* formulário */
.cartao{background:var(--folha);border:2px solid var(--linha);border-radius:20px;padding:16px;display:grid;gap:14px;text-align:left}
.rot{font-size:13px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;display:block;margin-bottom:6px}
.opcional{font-weight:600;text-transform:none;letter-spacing:0;color:var(--tinta-2)}
.campo{width:100%;font:inherit;font-size:17px;padding:13px 15px;border:2px solid var(--linha);border-radius:14px;background:#fff;color:var(--tinta)}
.campo:focus{border-color:var(--tinta-2);outline:none}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opc{border:2px solid var(--linha);background:#fff;border-radius:14px;padding:13px 10px;cursor:pointer;font-weight:800;font-size:16px}
.opc[aria-pressed="true"]{border-color:var(--natal);background:#FDEDEC;box-shadow:inset 0 0 0 1px var(--natal)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--linha);background:#fff;border-radius:999px;padding:7px 12px;cursor:pointer;font-weight:700;font-size:14.5px}
.chip[aria-pressed="true"]{border-color:var(--natal);background:#FDEDEC}
.erro{color:var(--natal);font-weight:700;font-size:14px;min-height:1.2em;text-align:center}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:16px;padding:17px 18px;
  font-family:var(--fonte-titulo);font-size:19px;font-weight:600;cursor:pointer;text-decoration:none;
  background:var(--natal);color:#fff;box-shadow:0 5px 0 var(--natal-escuro);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--natal-escuro)}
.btn.zap{background:var(--zap);box-shadow:0 5px 0 var(--zap-escuro)}
.btn.zap:active{box-shadow:0 2px 0 var(--zap-escuro)}
.btn-sec{background:none;border:0;color:var(--tinta-2);font-weight:700;cursor:pointer;padding:6px;font-size:15px;text-decoration:underline;text-underline-offset:3px}
.mini{font-size:14px;color:var(--tinta-2)}
.confia{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.confia div{background:#fff;border:1px solid var(--linha);border-radius:14px;padding:10px 6px;font-size:12.5px;font-weight:700;color:var(--tinta-2);line-height:1.3}
.confia b{display:block;font-size:20px}
/* capa de exemplo com o nome */
.capa{position:relative;width:min(280px,76%);justify-self:center;filter:drop-shadow(0 12px 18px rgba(126,31,31,.28))}
.capa svg{display:block;width:100%;height:auto}
.capa .play{transform-origin:206px 252px;animation:pulsa 1.6s ease-in-out infinite}
@keyframes pulsa{50%{transform:scale(1.08)}}
.aviso-ex{font-size:13px;color:var(--tinta-2);margin-top:-6px}
.passos{display:grid;gap:8px;text-align:left;counter-reset:p;margin:0;padding:0}
.passos li{list-style:none;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;background:#fff;border:1px solid var(--linha);border-radius:14px;padding:9px 12px;font-size:14.5px}
.passos li::before{counter-increment:p;content:counter(p);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--ouro);font-family:var(--fonte-titulo);font-weight:700}
.preco{font-family:var(--fonte-titulo);font-weight:700;color:var(--natal)}
.faq{display:grid;gap:8px;text-align:left}
.faq details{background:#fff;border:1px solid var(--linha);border-radius:14px;padding:12px 14px}
.faq summary{font-weight:800;cursor:pointer}
.faq p{margin-top:6px;color:var(--tinta-2);font-size:15px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app" aria-live="polite"></div>

<script>
/* ============ CONFIGURAÇÃO ============ */
const CONFIG = {
  whatsapp: "5511968155528",   // número do atendimento (DDI 55 + DDD, só dígitos)
  preco: "R$ 19,90",
  valor: 19.90
};
/* exemplos do antes e depois (foto real de exemplo → desenho com Jesus) */
const EXEMPLOS = {
  menino: {nome:"Davi",  foto:"exemplo-davi-foto.jpg",  desenho:"exemplo-davi-desenho.jpg",  video:"exemplo-jesus-davi.mp4?v=2", poster:"exemplo-jesus-davi.jpg"},
  menina: {nome:"Alice", foto:"exemplo-alice-foto.jpg", desenho:"exemplo-alice-desenho.jpg", video:"exemplo-jesus.mp4?v=2", poster:"exemplo-jesus.jpg"}
};
/* ===================================== */

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const track = (ev, data, id) => { try { if (window.fbq) window.fbq("track", ev, data || {}, id ? {eventID:id} : undefined); } catch(e){} };
const QUEM = ["Vovó","Vovô","Mamãe","Papai","Titia","Madrinha"];

const novo = () => ({tela:"inicio", nome:"", genero:"", quem:"", quemNome:"", codigo:"", exemplo:"menina"});
/* exemplo do gênero escolhido; sem vídeo do menino ainda, usa o da menina */
const ex = g => { const e = EXEMPLOS[g] || EXEMPLOS.menina; return e.video ? e : EXEMPLOS.menina; };
let S = novo();
try { const s = JSON.parse(localStorage.getItem("fc_natal_jesus")||"null"); if (s) S = Object.assign(novo(), s); } catch(e){}
const salvar = () => { try { localStorage.setItem("fc_natal_jesus", JSON.stringify(S)); } catch(e){} };
const dele = () => S.genero === "menina" ? "dela" : "dele";
const nome = () => esc(S.nome || "Seu pequeno");
const marca = `<div class="marca"><img src="../marca/logo.png" alt="Fábrica de Contos" width="360" height="376"></div>`;
const diasNatal = () => { const h = new Date(); let n = new Date(h.getFullYear(), 11, 25); if (h > n) n = new Date(h.getFullYear()+1, 11, 25); return Math.ceil((n - h) / 86400000); };
const dedicatoria = () => S.quem ? `Com amor, ${S.quem}${S.quemNome.trim() ? " " + S.quemNome.trim() : ""}` : "";

/* tela 2: celular passando os desenhos com Jesus, com o nome da criança no título */
function capa(){
  const n = nome();
  return `<div class="celular capa-cel">
      <video src="${ex(S.genero).video}" poster="${ex(S.genero).poster}" muted autoplay loop playsinline preload="metadata" aria-label="Trecho do desenho animado com Jesus"></video>
      <div class="titulo-cel"><b>${n}</b><span>e o Natal com Jesus</span></div>
    </div>`;
}

function antesDepois(){
  const e = EXEMPLOS.menina;
  return `<div class="hero-jesus">
      <div class="ad-col">
        <img class="foto" src="${e.foto}" alt="Foto real de exemplo: ${e.nome}" width="400" height="400"><small>A foto</small>
        <span class="seta" aria-hidden="true">⬇</span>
        <img class="desenho" src="${e.desenho}" alt="${e.nome} no desenho com Jesus" width="400" height="400"><small>Vira desenho</small>
      </div>
      <div class="celular">
        <video src="historia-alice.mp4?v=2" poster="historia-alice.jpg?v=2" ${SOM.ligado ? "" : "muted"} autoplay loop playsinline preload="metadata" aria-label="Trecho do desenho animado com Jesus"></video>
        <button class="tag som" data-acao="som" aria-pressed="${SOM.ligado}">${SOM.ligado ? "🔇 Tirar o som" : "🔊 Ouvir Jesus"}</button>
      </div>
    </div>`;
}

function mensagemZap(){
  const L = ["Oi! Quero o desenho de Natal com Jesus ✨", `Pedido ${S.codigo}`, `Criança: ${S.nome.trim()} (${S.genero})`];
  L.push("Já vou mandar a foto 📸");
  return L.join("\n");
}
const linkZap = () => `https://api.whatsapp.com/send?phone=${CONFIG.whatsapp}&text=${encodeURIComponent(mensagemZap())}`;

const TELAS = {
inicio(){
  return `${marca}<section class="tela">
    <span class="selo">✨ Faltam ${diasNatal()} dias para o Natal</span>
    <h1 class="h1-arte"><img src="headline-com-jesus.webp" alt="Seu filho ou seu neto num desenho animado de Natal com Jesus" width="1200" height="445"></h1>
    <div id="ad">${antesDepois()}</div>
    <div class="cartao">
      <div><label class="rot" for="fNome">Nome da criança</label>
        <input class="campo" id="fNome" maxlength="20" autocomplete="off" enterkeyhint="done" placeholder="Ex: Alice, Miguel" value="${esc(S.nome)}"></div>
      <div><span class="rot">É menino ou menina?</span>
        <div class="duas">
          <button class="opc" data-g="menino" aria-pressed="${S.genero==="menino"}">👦 Menino</button>
          <button class="opc" data-g="menina" aria-pressed="${S.genero==="menina"}">👧 Menina</button>
        </div></div>
      <p class="erro" id="erro"></p>
      <button class="btn zap" data-acao="pedir">Quero o desenho com Jesus</button>
      <p class="mini" style="margin-top:-6px;text-align:center"><span class="preco">${CONFIG.preco}</span> no Pix · pronto em até 24h · se o rostinho não ficar parecido, a gente refaz</p>
    </div>
    <p class="sub">Um vídeo narrado com o rostinho e o nome da criança, numa história de Natal com Jesus, cheia de amor e fé. Para assistir na TV com a família.</p>
    <div class="confia">
      <div><b>💛</b>Se o rostinho não ficar parecido, a gente refaz</div>
      <div><b>📲</b>Chega no WhatsApp</div>
      <div><b>⏱️</b>Pronto em até 24h</div>
    </div>
    <div class="faq">
      <details><summary>O que eu recebo?</summary><p>Um desenho animado em vídeo, com uma história de Natal narrada: a criança encontra Jesus em Belém e aprende o verdadeiro sentido do Natal. Chega no seu WhatsApp.</p></details>
      <details><summary>Quanto custa?</summary><p>${CONFIG.preco}, no Pix, direto no WhatsApp. Depois do Pix e da foto, o desenho fica pronto em até 24h.</p></details>
      <details><summary>É um livro? Vem pelo correio?</summary><p>Não. É um vídeo digital: sem frete, dá para ver no celular, colocar na TV e mandar no grupo da família.</p></details>
      <details><summary>E se não ficar parecido?</summary><p>A gente refaz o rostinho sem custo. A história é a mesma, só ajustamos a criança até ficar com a carinha dela.</p></details>
      <details><summary>E a foto da criança?</summary><p>Você manda no WhatsApp. Ela é usada só para fazer o desenho e apagada depois da entrega.</p></details>
    </div>
  </section>`;
},

previa(){
  return `${marca}<section class="tela">
    <h2>O Natal com Jesus de <em>${nome()}</em> ✨</h2>
    ${capa()}
    <p class="aviso-ex">Exemplo do desenho. O seu é feito com a foto ${dele()}.</p>
    <a class="btn zap" id="btnZap" href="${linkZap()}">Fazer o pedido no WhatsApp</a>
    <p class="mini" style="margin-top:-6px"><span class="preco">${CONFIG.preco}</span> no Pix · pronto em até 24h · se o rostinho não ficar parecido, a gente refaz</p>
    <div class="cartao">
      <ol class="passos">
        <li>Mande uma foto ${dele()} no WhatsApp</li>
        <li>Pague <span class="preco">${CONFIG.preco}</span> no Pix</li>
        <li>Receba o desenho animado completo em até 24h</li>
      </ol>
    </div>
    <button class="btn-sec" data-acao="voltar">← Trocar o nome</button>
  </section>`;
}
};

function render(){
  S.tela = "inicio";
  document.getElementById("app").innerHTML = TELAS[S.tela]();
  const f = document.getElementById("fNome");
  if (f) f.addEventListener("input", () => { S.nome = f.value; salvar(); atualizaNomeCel(); });
  const q = document.getElementById("fQuem");
  if (q) q.addEventListener("input", () => { S.quemNome = q.value; salvar(); atualizaCapa(); });
}
/* o nome digitado aparece em cima do vídeo do topo */
function atualizaNomeCel(){
  const t = document.getElementById("tituloCel"), b = document.getElementById("nomeCel"); if (!t || !b) return;
  const n = S.nome.trim(); b.textContent = n ? n.charAt(0).toUpperCase() + n.slice(1) : ""; t.hidden = !n;
}
function atualizaCapa(){
  const c = document.querySelector(".capa"); if (c) c.outerHTML = capa();
  const z = document.getElementById("btnZap"); if (z) z.href = linkZap();
}

/* som da voz de Jesus: liga no primeiro toque na página (o navegador não deixa tocar com som antes disso)
   e continua ligado quando troca menino/menina; só desliga se a pessoa tocar em "Tirar o som" */
const SOM = {ligado:false, desligou:false};
function aplicaSom(doInicio){
  const v = document.querySelector(".hero-jesus video"), b = document.querySelector("[data-acao=som]");
  if (b){ b.setAttribute("aria-pressed", SOM.ligado); b.textContent = SOM.ligado ? "🔇 Tirar o som" : "🔊 Ouvir Jesus"; }
  if (!v) return;
  v.muted = !SOM.ligado;
  if (SOM.ligado){ if (doInicio) v.currentTime = 0; v.volume = 1; v.play().catch(()=>{}); }
}
const primeiroToque = (ev) => {
  if (SOM.ligado || SOM.desligou || ev.target.closest?.("[data-acao=som]")) return;
  SOM.ligado = true; aplicaSom(true); track("ViewContent", {content_name:"natal-jesus-ouviu"});
};
document.addEventListener("pointerdown", primeiroToque, true);
document.addEventListener("keydown", primeiroToque, true);

document.addEventListener("click", (ev) => {
  const b = ev.target.closest("button, a"); if (!b) return;
    if (b.dataset.g){ S.genero = b.dataset.g; S.exemplo = b.dataset.g; salvar(); document.querySelectorAll("[data-g]").forEach(x => x.setAttribute("aria-pressed", x === b)); return; }
  if (b.dataset.quem){
    S.quem = S.quem === b.dataset.quem ? "" : b.dataset.quem; salvar();
    render(); const q = document.getElementById("fQuem"); if (q) q.focus();
    return;
  }
  if (b.dataset.acao === "som"){
    SOM.ligado = !SOM.ligado; if (!SOM.ligado) SOM.desligou = true;
    aplicaSom(true);
    if (SOM.ligado) track("ViewContent", {content_name:"natal-jesus-ouviu"});
    return;
  }
  if (b.dataset.acao === "pedir"){
    /* vai direto para o WhatsApp com o pedido pronto (sem tela de resumo) */
    const n = (document.getElementById("fNome")?.value || "").trim();
    const erro = document.getElementById("erro");
    if (n.length < 2){ erro.textContent = "Escreva o nome da criança."; document.getElementById("fNome").focus(); return; }
    if (!S.genero){ erro.textContent = "Escolha menino ou menina."; return; }
    erro.textContent = "";
    S.nome = n.charAt(0).toUpperCase() + n.slice(1);
    if (!S.codigo) S.codigo = "JS" + Math.floor(1000 + Math.random() * 9000);
    salvar();
    const url = linkZap();
    track("Lead", {content_name:"natal-jesus"});
    track("Contact", {content_name:"natal-jesus", value:CONFIG.valor, currency:"BRL"}, S.codigo + "-contato");
    b.textContent = "Abrindo o WhatsApp...";
    /* segura 0,7 s para o Pixel enviar antes do WhatsApp abrir */
    setTimeout(() => { location.href = url; b.textContent = "Quero o desenho com Jesus"; }, 700);
    return;
  }
  if (b.dataset.acao === "voltar"){ S.tela = "inicio"; salvar(); render(); window.scrollTo({top:0}); return; }
  if (b.id === "btnZap"){
    /* No navegador do Instagram/Facebook o WhatsApp abre na hora e o evento se perde: segura 0,7 s para o Pixel enviar o Contact */
    ev.preventDefault();
    const url = linkZap();
    track("Contact", {content_name:"natal-jesus", value:CONFIG.valor, currency:"BRL"}, S.codigo + "-contato");
    b.textContent = "Abrindo o WhatsApp...";
    setTimeout(() => { location.href = url; }, 700);
  }
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && ev.target.matches("input")){ ev.preventDefault(); ev.target.blur(); }
});

render();
</script>
</body>
</html>
